; PlatformIO Project Configuration
; ESP8266 + LD2410B Human Presence Radar Sensor

[env:esp8266]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
upload_speed = 115200
upload_resetmethod = nodemcu
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dio
upload_port = /dev/cu.usbserial-145320
monitor_port = /dev/cu.usbserial-145320
build_src_filter = +<main.cpp> +<RadarProtocol.cpp> +<RadarParser.cpp> +<PresenceRelay.cpp> +<WebPortal.cpp>

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
build_src_filter = +<main_esp32s3.cpp>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
